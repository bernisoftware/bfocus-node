# Publica @bfocus/sdk no npm ao receber uma tag vX.Y.Z no espelho público
# bernisoftware/bfocus-node (tag criada pelo scripts/release-sdks.sh do monorepo).
#
# Só publica com a suíte verde no Node mínimo (18) e máximo (22) suportados, rodando contra o
# artefato construído, e com a tag igual à versão do package.json.
# Requer o secret NPM_TOKEN (automation token da org @bfocus no npmjs).
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Os testes importam "@bfocus/sdk" → rodam contra dist/ (ESM e CJS).
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: tag == package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG não bate com package.json ($PKG)"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
